<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wispr Tell — Dictation History</title>
  <style>
    :root {
      --bg: #0c0e14;
      --card-bg: #161a23;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #eef1f6;
      --text-muted: #94a3b8;
      --accent: #14b8a6;
      --accent-dim: rgba(20, 184, 166, 0.15);
      --danger: #f87171;
      --input-bg: #1c2230;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
    }
    header {
      padding: 16px 24px;
      background: #11141c;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .search-box {
      flex: 1;
      max-width: 480px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn:hover {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }
    .btn.btn-danger:hover {
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
      border-color: var(--danger);
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.1s, border-color 0.15s;
    }
    .card:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .meta-badge {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .meta-badge.offline {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
    }
    .card-text {
      font-size: 14px;
      line-height: 1.55;
      color: #f8fafc;
      -webkit-user-select: text;
      user-select: text;
      word-break: break-word;
    }
    /* Audio player */
    .audio-player {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #11141d;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 4px;
    }
    .btn-play {
      background: var(--accent);
      color: #0c0e14;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .btn-play:hover {
      transform: scale(1.08);
    }
    .audio-scrubber {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .audio-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .audio-time {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
      min-width: 72px;
      text-align: right;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .act-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .act-icon:hover {
      color: var(--text);
      background: rgba(255,255,255,0.08);
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      gap: 10px;
      padding: 40px;
    }
  </style>
</head>
<body>
<header>
  <div class="header-title">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
    <span>Dictation History</span>
  </div>

  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search dictations...">
  </div>

  <div class="header-actions">
    <button class="btn btn-danger" id="btnClearHistory">Clear All</button>
  </div>
</header>

<main id="historyContainer"></main>

<script>
  let allEntries = [];
  const container = document.getElementById('historyContainer');
  const searchInput = document.getElementById('searchInput');
  const btnClearHistory = document.getElementById('btnClearHistory');

  let activeAudio = null;
  let activeBtn = null;

  async function loadHistory() {
    try {
      allEntries = await window.wisprtell.getHistory() || [];
      renderHistory();
    } catch (e) {
      console.error('Failed to load history:', e);
    }
  }

  function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    const now = new Date();
    const isToday = date.toDateString() === now.toDateString();
    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return isToday ? `Today at ${timeStr}` : `${date.toLocaleDateString([], { month: 'short', day: 'numeric' })} at ${timeStr}`;
  }

  function formatSec(sec) {
    const s = Math.floor(sec || 0);
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return `${m}:${rem.toString().padStart(2, '0')}`;
  }

  function renderHistory() {
    const query = (searchInput.value || '').toLowerCase().trim();
    // Safe substring search (<5ms)
    const filtered = query
      ? allEntries.filter(e => e.text && e.text.toLowerCase().includes(query))
      : allEntries;

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <div style="font-size:14px;">${query ? 'No matching dictations found' : 'No dictation history yet'}</div>
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(item => `
      <div class="card" id="card-${item.id}">
        <div class="card-meta">
          <div class="meta-left">
            <span>${formatTime(item.timestamp)}</span>
            <span class="meta-badge">${item.wordCount || 0} words</span>
            <span class="meta-badge">${Math.round((item.durationMs || 0) / 100) / 10}s</span>
            ${item.offline ? `<span class="meta-badge offline">Offline</span>` : ''}
          </div>
          <div class="card-actions">
            <button class="act-icon btn-copy" data-id="${item.id}" title="Copy Text">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="act-icon btn-del" data-id="${item.id}" title="Delete" style="color:var(--danger)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="card-text">${escapeHtml(item.text)}</div>

        ${item.audioFile ? `
          <div class="audio-player" id="player-${item.id}">
            <button class="btn-play" data-id="${item.id}" title="Play Recording">
              <svg class="icon-play" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </button>
            <input type="range" class="audio-scrubber" min="0" max="100" value="0" data-id="${item.id}">
            <span class="audio-time" id="time-${item.id}">0:00 / ${formatSec((item.durationMs || 0)/1000)}</span>
          </div>
        ` : ''}
      </div>
    `).join('');

    attachListeners();
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function attachListeners() {
    // Copy
    container.querySelectorAll('.btn-copy').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const item = allEntries.find(e => e.id === id);
        if (item && item.text) {
          await window.wisprtell.copyText(item.text);
          btn.style.color = '#34d399';
          setTimeout(() => btn.style.color = '', 1000);
        }
      };
    });

    // Delete
    container.querySelectorAll('.btn-del').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
        await window.wisprtell.deleteHistory(id);
        allEntries = allEntries.filter(e => e.id !== id);
        renderHistory();
      };
    });

    // Audio Playback
    container.querySelectorAll('.btn-play').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const playerDiv = document.getElementById(`player-${id}`);
        const scrubber = playerDiv.querySelector('.audio-scrubber');
        const timeDisplay = document.getElementById(`time-${id}`);

        if (activeAudio && activeBtn === btn) {
          if (!activeAudio.paused) {
            activeAudio.pause();
            btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
            return;
          } else {
            activeAudio.play();
            btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
            return;
          }
        }

        if (activeAudio) {
          activeAudio.pause();
          if (activeBtn) {
            activeBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
          }
        }

        try {
          const audioData = await window.wisprtell.getHistoryAudio(id);
          if (!audioData || !audioData.dataUrl) {
            playerDiv.innerHTML = `<span style="font-size:11.5px;color:var(--text-muted);">Audio recording expired or unavailable</span>`;
            return;
          }

          const audio = new Audio(audioData.dataUrl);
          activeAudio = audio;
          activeBtn = btn;
          btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;

          audio.ontimeupdate = () => {
            if (!audio.duration) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            scrubber.value = pct;
            timeDisplay.textContent = `${formatSec(audio.currentTime)} / ${formatSec(audio.duration)}`;
          };

          audio.onended = () => {
            btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
            scrubber.value = 0;
          };

          scrubber.oninput = () => {
            if (audio.duration) {
              audio.currentTime = (scrubber.value / 100) * audio.duration;
            }
          };

          audio.play();
        } catch (err) {
          console.error('Playback error:', err);
        }
      };
    });
  }

  // Real-time search
  searchInput.oninput = () => renderHistory();

  // Clear All
  btnClearHistory.onclick = async () => {
    if (confirm('Clear all dictation history and saved audio recordings?')) {
      if (activeAudio) { activeAudio.pause(); activeAudio = null; }
      await window.wisprtell.clearHistory();
      allEntries = [];
      renderHistory();
    }
  };

  // Live update subscription
  window.wisprtell.onHistoryUpdated(data => {
    if (data && data.item) {
      allEntries.unshift(data.item);
      renderHistory();
    }
  });

  // Theme synchronization
  function applyTheme(payload) {
    if (!payload) return;
    const { theme, effectiveTheme, variables, hasNativeMaterial } = payload;
    document.documentElement.setAttribute('data-theme', effectiveTheme || theme);
    document.documentElement.dataset.material = hasNativeMaterial ? 'native' : 'fallback';
    if (variables) {
      for (const [prop, val] of Object.entries(variables)) {
        document.documentElement.style.setProperty(prop, val);
      }
    }
  }

  if (window.wisprtell && window.wisprtell.onThemeSync) {
    window.wisprtell.onThemeSync(applyTheme);
  }
  if (window.wisprtell && window.wisprtell.getTheme) {
    window.wisprtell.getTheme().then(applyTheme).catch(() => {});
  }

  loadHistory();
</script>
</body>
</html>
