<!doctype html>
<html><head><meta charset="utf-8"><title>Welcome to Wispr Tell</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI", system-ui, sans-serif; background:#14161c; color:#eef1f6;
    display:flex; align-items:center; justify-content:center; height:100vh; -webkit-user-select:none; }
  .card { text-align:center; max-width:420px; padding:40px; }
  .mic { width:84px; height:84px; margin:0 auto 24px; border-radius:26px; background:#0d9488;
    display:flex; align-items:center; justify-content:center; font-size:42px;
    box-shadow:0 12px 40px rgba(13,148,136,.4); animation:float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-8px); } }
  h1 { font-size:26px; font-weight:700; margin-bottom:10px; }
  p { color:#9aa3b2; font-size:14.5px; line-height:1.6; margin-bottom:26px; }
  .kbd { display:inline-flex; gap:8px; margin-bottom:30px; }
  .kbd span { background:#2a2e3a; border:1px solid rgba(255,255,255,.14); border-bottom-width:3px;
    border-radius:9px; padding:9px 18px; font-size:16px; font-weight:600; }
  button { background:#0d9488; color:#fff; border:none; border-radius:12px; padding:14px 44px;
    font-size:15px; font-weight:600; cursor:pointer; transition:.15s; font-family:inherit; }
  button:hover { background:#14b8a6; transform:translateY(-1px); }
  .tiny { margin-top:18px; font-size:12px; color:#5d6577; }
</style></head>
<body>
<div class="card">
  <div class="mic">🎙</div>
  <h1>Wispr Tell</h1>
  <p>Your voice, typed anywhere.<br>Hold the shortcut, speak naturally, release —<br>your words appear at the cursor.</p>
  <div class="kbd"><span>Ctrl</span><span>+</span><span>Win</span></div><br>
  <button id="go">Start dictating</button>
  <div class="tiny">Free Groq cloud engine · paste your key in Settings to start</div>
</div>
<script>
  document.getElementById('go').onclick = () => window.wisprtell.welcomeDone();
</script>
</body></html>
