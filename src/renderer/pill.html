<!doctype html>
<html><head><meta charset="utf-8"><title>Wispr Tell</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; }
  html, body {
    width:100%; height:100%; background:transparent; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  body { display:flex; align-items:center; justify-content:center; }

  #pill {
    display:flex; align-items:center; gap:14px;
    min-width:300px; max-width:480px; padding:13px 22px 13px 18px;
    background:rgba(18, 21, 28, 0.90);
    -webkit-backdrop-filter:blur(32px) saturate(190%);
    backdrop-filter:blur(32px) saturate(190%);
    border:1px solid rgba(255,255,255,0.12);
    border-top:1px solid rgba(255,255,255,0.24);
    border-radius:24px;
    cursor:pointer;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.55),
      0 0 1px rgba(255,255,255,0.25) inset,
      0 0 32px rgba(13,148,136,0.14);
    color:#fff;
    opacity:0;
    transform:translateY(22px) scale(0.92);
    filter:blur(4px);
    transition:
      opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
      filter 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Pop up entrance */
  #pill.show {
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0px);
  }

  /* Smooth exit */
  #pill.hiding {
    opacity:0;
    transform:translateY(16px) scale(0.95);
    filter:blur(3px);
    transition:
      opacity 0.22s cubic-bezier(0.23, 1, 0.32, 1),
      transform 0.22s cubic-bezier(0.23, 1, 0.32, 1),
      filter 0.22s ease;
  }

  #wave { width:68px; height:36px; flex:none; }
  #labelBox {
    display:flex; align-items:center; gap:8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #label {
    font-size:14.5px; font-weight:500; letter-spacing:0.1px; color:#eef1f6;
    overflow:hidden; text-overflow:ellipsis;
  }
  #label .dim { color:#94a3b8; font-weight:400; font-size:13.5px; }

  .mode-tag {
    background:rgba(20, 184, 166, 0.2);
    border:1px solid rgba(20, 184, 166, 0.45);
    color:#5eead4;
    font-size:11px;
    font-weight:600;
    padding:2px 7px;
    border-radius:10px;
    letter-spacing:0.3px;
    text-transform:uppercase;
  }

  .check {
    width:26px; height:26px; flex:none; border-radius:50%;
    background:#14b8a6; display:flex; align-items:center; justify-content:center;
    font-size:15px; color:#062a27; font-weight:700;
    box-shadow:0 0 16px rgba(20,184,166,0.4);
    animation:checkPop 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes checkPop {
    from { transform:scale(0.6); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }

  .spin {
    width:22px; height:22px; flex:none; border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.18); border-top-color:#5eead4;
    animation:rot 0.65s linear infinite;
  }
  @keyframes rot { to { transform:rotate(360deg); } }

  .errdot {
    width:22px; height:22px; flex:none; border-radius:50%; background:#f59e0b;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#3a2200; font-weight:700;
  }
</style></head>
<body>
<div id="pill">
  <canvas id="wave" width="136" height="72"></canvas>
  <div id="icon"></div>
  <div id="labelBox">
    <span id="label">Wispr Tell</span>
    <span id="modeTag" style="display:none;" class="mode-tag">Hands-free</span>
  </div>
</div>
<script>
  const pill = document.getElementById('pill');
  const label = document.getElementById('label');
  const modeTag = document.getElementById('modeTag');
  const iconBox = document.getElementById('icon');
  const canvas = document.getElementById('wave');
  const g = canvas.getContext('2d');

  let level = 0, target = 0, bars = new Array(16).fill(0), raf = null, hideTimer = null;

  function draw() {
    target = Math.max(0, target * 0.86);
    level += (target - level) * 0.35;
    g.clearRect(0, 0, 136, 72);
    const n = bars.length, bw = 136 / n;
    for (let i = 0; i < n; i++) {
      const wave = Math.sin(Date.now() / 240 + i * 0.82) * 0.5 + 0.5;
      const want = 6 + wave * 28 * (0.22 + level * 2.5);
      bars[i] += (want - bars[i]) * 0.42;
      const h = Math.max(3.5, Math.min(66, bars[i]));
      const x = i * bw + bw * 0.2, w = bw * 0.6, y = (72 - h) / 2;
      const grad = g.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, '#5eead4');
      grad.addColorStop(1, '#0d9488');
      g.fillStyle = grad;
      g.beginPath();
      if (g.roundRect) g.roundRect(x, y, w, h, w / 2); else g.rect(x, y, w, h);
      g.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  function startWave() { canvas.style.display = ''; if (!raf) draw(); }
  function stopWave() { canvas.style.display = 'none'; if (raf) { cancelAnimationFrame(raf); raf = null; } }

  function showPill() {
    clearTimeout(hideTimer);
    pill.classList.remove('hiding');
    pill.classList.add('show');
  }

  function hidePill(ms = 0) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      pill.classList.remove('show');
      pill.classList.add('hiding');
      setTimeout(() => {
        if (!pill.classList.contains('show')) {
          pill.classList.remove('hiding');
        }
      }, 240);
    }, ms);
  }

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  window.wisprtell.onPillState(({ state, label: text, transcript }) => {
    if (state === 'hidden') { hidePill(0); return; }
    showPill();

    const isHandsFree = String(text || '').includes('Hands-free');
    modeTag.style.display = isHandsFree ? 'inline-block' : 'none';

    if (state === 'listening') {
      startWave(); iconBox.innerHTML = '';
      label.innerHTML = esc(text || 'Listening…') + ' <span class="dim">' + esc(transcript || 'release to type') + '</span>';
    } else if (state === 'working') {
      stopWave(); iconBox.innerHTML = '<div class="spin"></div>';
      label.textContent = text || 'Typing…';
    } else if (state === 'done') {
      stopWave(); iconBox.innerHTML = '<div class="check">✓</div>';
      label.textContent = (transcript || '').slice(0, 60) || 'Done';
      hidePill(1400);
    } else if (state === 'error') {
      stopWave(); iconBox.innerHTML = '<div class="errdot">!</div>';
      label.textContent = text || 'Something went wrong';
      hidePill(2600);
    }
  });

  window.wisprtell.onMicLevel(l => { target = Math.min(1, Math.max(0, l)); });

  pill.addEventListener('click', () => {
    if (window.wisprtell && window.wisprtell.toggleHandsFree) {
      window.wisprtell.toggleHandsFree();
    }
  });
</script>
</body></html>
