<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wispr Tell Status</title>
<style>
  :root {
    --mic-level: 0;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Core Pill Styles */
  #pill {
    position: relative;
    display: flex;
    align-items: center;
    height: 32px;
    max-width: 300px;
    border-radius: 999px;
    
    /* Frosted glass */
    background: rgba(18, 18, 22, 0.65);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    backdrop-filter: blur(32px) saturate(200%);
    
    /* Subtle borders */
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    
    /* Base shadow */
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    
    cursor: pointer;
    overflow: hidden;
    color: #fff;
    
    /* Entrance / Exit styling */
    opacity: 0;
    transform: translateY(20px) scale(0.85);
    filter: blur(6px);
    
    /* Spring morphing transition */
    transition: 
      padding 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
      background 0.4s ease,
      border-color 0.4s ease,
      box-shadow 0.2s ease,
      opacity 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
      transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
      filter 0.4s ease;
  }

  /* Entrance */
  #pill.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }

  /* Exit */
  #pill.hiding {
    opacity: 0;
    transform: translateY(16px) scale(0.9);
    filter: blur(4px);
    transition: 
      opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      filter 0.3s ease;
  }

  /* State Paddings */
  #pill.state-hidden { padding: 0; }
  #pill.state-listening { 
    padding: 0 12px;
    box-shadow: 
      0 0 calc(var(--mic-level) * 16px) rgba(94, 234, 212, calc(var(--mic-level) * 0.4)),
      0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #pill.state-working { padding: 0 10px; }
  #pill.state-done { padding: 0 16px 0 12px; }
  
  #pill.state-error { 
    padding: 0 16px 0 12px;
    background: rgba(35, 20, 10, 0.7);
    border: 1px solid rgba(245, 158, 11, 0.15);
    border-top: 1px solid rgba(245, 158, 11, 0.3);
    box-shadow: 
      0 0 12px rgba(245, 158, 11, 0.2),
      0 8px 24px rgba(0, 0, 0, 0.6);
  }

  /* Internal Layout */
  .content {
    display: flex;
    align-items: center;
    height: 100%;
    width: 100%;
  }

  /* Grid Wrappers for Morphing Widths smoothly */
  .anim-wrapper {
    display: grid;
    grid-template-columns: 0fr;
    transition: grid-template-columns 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .anim-inner {
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Width Triggers for different states */
  #pill.state-listening #wave-wrapper { grid-template-columns: 40px; }
  
  #pill.state-working #icon-wrapper,
  #pill.state-done #icon-wrapper,
  #pill.state-error #icon-wrapper {
    grid-template-columns: 18px; 
  }

  #pill.state-done #text-wrapper,
  #pill.state-error #text-wrapper {
    grid-template-columns: 1fr;
  }

  /* Specific Elements */
  #wave {
    width: 40px; 
    height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #pill.state-listening #wave { opacity: 1; }

  #icon-box {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #text {
    padding-left: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #f8fafc;
    letter-spacing: -0.1px;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #pill.state-done #text,
  #pill.state-error #text {
    opacity: 1;
    transition-delay: 0.15s; /* Fade in nicely after width starts expanding */
  }
  #pill.state-error #text {
    color: #fcd34d;
  }

  /* Icon Animations & Styles */
  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-top-color: #5eead4;
    border-right-color: rgba(94, 234, 212, 0.4);
    animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2dd4bf, #0f766e);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(45, 212, 191, 0.4);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .check svg {
    width: 10px;
    height: 10px;
    color: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .warn {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #b45309);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .warn svg {
    width: 10px;
    height: 10px;
    color: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes popIn {
    0% { transform: scale(0.4) rotate(-15deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

</style>
</head>
<body>

<div id="pill" class="state-hidden hiding">
  <div class="content">
    
    <div id="wave-wrapper" class="anim-wrapper">
      <div class="anim-inner">
        <canvas id="wave" width="80" height="40"></canvas>
      </div>
    </div>
    
    <div id="icon-wrapper" class="anim-wrapper">
      <div class="anim-inner">
        <div id="icon-box"></div>
      </div>
    </div>
    
    <div id="text-wrapper" class="anim-wrapper">
      <div class="anim-inner">
        <div id="text"></div>
      </div>
    </div>

  </div>
</div>

<script>
  const pill = document.getElementById('pill');
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');
  const iconBox = document.getElementById('icon-box');
  const textBox = document.getElementById('text');

  // HDPI Canvas Setup
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 80 * dpr;
  canvas.height = 40 * dpr;
  ctx.scale(dpr, dpr);

  let rafId = null;
  let hideTimer = null;
  let micLevel = 0;
  let smoothedMic = 0;
  
  // Waveform logic
  const BARS = 5;
  let barHeights = new Array(BARS).fill(0);
  let time = 0;

  function drawWaveform() {
    time += 0.04;
    smoothedMic += (micLevel - smoothedMic) * 0.15;
    
    document.documentElement.style.setProperty('--mic-level', smoothedMic.toFixed(3));
    ctx.clearRect(0, 0, 80, 40);

    const barWidth = 4;
    const gap = 3;
    const totalWidth = BARS * barWidth + (BARS - 1) * gap;
    const startX = (80 - totalWidth) / 2;
    const centerY = 20;

    for (let i = 0; i < BARS; i++) {
      // Organic noise via combined sine waves for natural, breathing movement
      const phase1 = Math.sin(time + i * 0.4);
      const phase2 = Math.cos(time * 0.7 - i * 0.3);
      const phase3 = Math.sin(time * 1.1 + i * 0.5);
      
      const organic = (phase1 * 0.5 + phase2 * 0.3 + phase3 * 0.2 + 1) / 2;
      const targetHeight = 4 + (organic * 6) + (smoothedMic * 18 * (organic + 0.5));
      
      barHeights[i] += (targetHeight - barHeights[i]) * 0.3;
      const h = Math.max(3, Math.min(36, barHeights[i]));
      
      const x = startX + i * (barWidth + gap);
      const y = centerY - h / 2;
      
      const grad = ctx.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, '#5eead4');
      grad.addColorStop(1, '#0d9488');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, barWidth, h, barWidth / 2);
      else ctx.rect(x, y, barWidth, h);
      ctx.fill();
    }
    rafId = requestAnimationFrame(drawWaveform);
  }

  function startListening() {
    if (!rafId) drawWaveform();
  }

  function stopListening() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    barHeights.fill(0);
    smoothedMic = 0;
    document.documentElement.style.setProperty('--mic-level', 0);
  }

  function showPill() {
    clearTimeout(hideTimer);
    pill.classList.remove('hiding');
    pill.classList.add('show');
  }

  function hidePill(delayMs = 0) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      pill.classList.remove('show');
      pill.classList.add('hiding');
      
      setTimeout(() => {
        if (pill.classList.contains('hiding')) {
          pill.className = 'state-hidden hiding';
          stopListening();
        }
      }, 400);
    }, delayMs);
  }

  // Requested to keep the esc function
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // SVG Icons
  const iconCheck = `<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg></div>`;
  const iconWarn = `<div class="warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg></div>`;
  const iconSpinner = `<div class="spinner"></div>`;

  window.wisprtell.onPillState(({ state, label, transcript }) => {
    if (state === 'hidden') {
      hidePill(0);
      return;
    }
    
    showPill();
    pill.className = 'show state-' + state;

    if (state === 'listening') {
      startListening();
      iconBox.innerHTML = '';
      textBox.textContent = '';
      
    } else if (state === 'working') {
      stopListening();
      iconBox.innerHTML = iconSpinner;
      textBox.textContent = '';
      
    } else if (state === 'done') {
      stopListening();
      iconBox.innerHTML = iconCheck;
      textBox.textContent = (transcript || '').slice(0, 50) || 'Done';
      hidePill(1400);
      
    } else if (state === 'error') {
      stopListening();
      iconBox.innerHTML = iconWarn;
      textBox.textContent = label || 'Error';
      hidePill(2400);
    }
  });

  window.wisprtell.onMicLevel(l => {
    micLevel = Math.min(1, Math.max(0, l));
  });

  pill.addEventListener('click', () => {
    if (window.wisprtell && window.wisprtell.toggleHandsFree) {
      window.wisprtell.toggleHandsFree();
    }
  });
</script>
</body>
</html>
